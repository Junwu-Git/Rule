# =============================================================================
# WorkBuddy AI 国际版 - Clash / Mihomo 分流规则（仅国际版链路）
# -----------------------------------------------------------------------------
# 实测结果（2026-10-20）：
#   - www.workbuddy.ai / www.codebuddy.ai -> 43.160.158.125（腾讯云新加坡）
#   - sg.tgalileo.com -> 43.156.86.196（新加坡）
#   - tgalileo.com    -> 43.129.115.113（香港）
#
# 国内版域名已全部剔除，保持直连：
#   workbuddy.cn / codebuddy.cn / qq.com / tencent.com 账号域
#   myqcloud.com 的 COS 桶（广州/北京/南京节点）
#   static.workbuddy.cn / download.codebuddy.cn
#
# 使用方法：
#   合并 proxy-groups 和 rules 到你的配置，放在 GEOIP,CN,DIRECT 之前。
#   把 "🚀 节点选择" 改成你自己的代理组名。
# =============================================================================

proxy-groups:
  - name: WorkBuddy
    type: select
    proxies:
      - 🚀 节点选择        # ← 改成你自己的代理组名
      - DIRECT

rules:
  # ---------------------------------------------------------------------------
  # 1. 国际版核心：API / 聊天 / 控制台 / Agent WebSocket
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,workbuddy.ai,WorkBuddy
  - DOMAIN-SUFFIX,codebuddy.ai,WorkBuddy

  # ---------------------------------------------------------------------------
  # 2. 云端沙箱 / 编辑器预览
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,workbuddy.agentos-worker.net,WorkBuddy
  - DOMAIN-SUFFIX,staging.agentos-worker.net,WorkBuddy
  - DOMAIN-SUFFIX,workbuddy-sandbox.com,WorkBuddy

  # ---------------------------------------------------------------------------
  # 3. 知识库分享校验（新加坡）
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,tencentsmh.com,WorkBuddy

  # ---------------------------------------------------------------------------
  # 4. 国际版遥测（HK/SG）
  #    不想占用代理流量就改成 REJECT，或整段删掉。
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,tgalileo.com,WorkBuddy

  # ---------------------------------------------------------------------------
  # 5. 出口 IP 探测（关键）
  #    应用启动时会请求 api.ipify.org / api64.ipify.org 获取本机公网 IP，
  #    并把它写进遥测和风控字段。这条必须走代理，否则后端仍会收到国内 IP。
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,ipify.org,WorkBuddy

  # ---------------------------------------------------------------------------
  # 7. 可选：登录页
  #    tencent.sso.codebuddy.cn 是 CN 域名，默认直连。
  #    如果登录后账号仍被判定为国内 IP，取消下面这行注释。
  # ---------------------------------------------------------------------------
  # - DOMAIN-SUFFIX,tencent.sso.codebuddy.cn,WorkBuddy

  # ---------------------------------------------------------------------------
  # 说明：以下域名没有放进来，按需自行添加
  #   - workbuddy.link                 分享链接（解析到北京 120.53.74.30）
  #   - static.workbuddy.cn            首页/playbook 静态配置（国内 CDN）
  #   - download.codebuddy.cn          国内下载镜像
  #   - workbuddy-extensions-*.myqcloud.com  扩展市场（广州）
  #   - codebuddy-platform-*.myqcloud.com    专家头像/市场图片（国内 CDN）
  #   - docs.qq.com / work.weixin.qq.com / map.qq.com 等文档、企微、地图功能
  #   - galileotelemetry.tencent.com   国内遥测（江苏）
  # ---------------------------------------------------------------------------
